<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>應援菜單 — For Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* 菜單頁專屬樣式，不會影響其他頁面 */
  .menu-category{ margin-bottom:44px; }
  .menu-category h3{
    font-family:'Cormorant Garamond', serif; font-weight:500; font-size:22px;
    color:var(--navy-deep); margin:0 0 18px; padding-bottom:10px; border-bottom:1px solid var(--line);
  }
  .menu-item{
    display:flex; justify-content:space-between; align-items:baseline; gap:16px;
    padding:14px 0; border-bottom:1px dashed var(--line);
  }
  .menu-item:last-child{ border-bottom:none; }
  .menu-item .mi-left{ flex:1; }
  .menu-item .mi-name{ font-size:14.5px; font-weight:500; color:var(--navy-deep); }
  .menu-item .mi-desc{ font-size:12px; color:var(--blue-mid); margin-top:4px; line-height:1.6; }
  .menu-item .mi-price{
    font-size:14px; color:var(--navy); white-space:nowrap;
    font-family:'Cormorant Garamond', serif; font-weight:600;
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner container">
    <a href="index.html" class="nav-logo script">For Us</a>

      <h3>飲品 Drinks</h3>

          <div class="mi-name">品項名稱</div>

        </div>

      <div class="menu-item">

      </div>

    <div class="menu-category">
      <h3>輕食 Food</h3>

      <div class="menu-item">
        <div class="mi-left">
          <div class="mi-name">品項名稱</div>
          <div class="mi-desc">這裡放品項說明</div>
        </div>
        <div class="mi-price">NT$220</div>
      </div>

        <div class="mi-left">

    <div class="badge-gift">
      <span>★</span>
      <span>這裡可以放低消規則、加購說明或其他提醒文字。</span>
    </div>

  </div>

<footer>
