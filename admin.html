<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>後台管理 — For Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="admin-shell">
  <div class="admin-title">
    <span class="script">For Us</span>
    <p>後台管理・狀態即時更新</p>
  </div>

  <div class="login-card" id="loginCard">
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label>密碼</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit">登入</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>

  <div class="hidden" id="adminPanel">
    <div class="admin-topbar">
      <span class="who" id="who"></span>
      <button class="logout-btn" id="logoutBtn">登出</button>
    </div>

    <div class="admin-group">
      <h3>應援好禮</h3>
      <div id="giftGroup"></div>
    </div>

    <div class="admin-group">
      <h3>預約時段</h3>
      <div id="slotGroup"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
