<div class="divider"><span>✦</span><span>✦</span><span>✦</span></div>
<section class="page-hero">
  <div class="snowfield" id="snowfield"></div>
  <div class="eyebrow">Stamp Rally</div>
  <h1>集章活動</h1>
  <p class="lede">現場共有四個關卡，點下方印章看看流程</p>
</section>
  
<section style="padding-top:0;">
  <div class="container">
    <div class="section-head">
      <div class="eyebrow">Postcard</div>
      <h2>集章明信片</h2>
      <p class="desc">印章就蓋在明信片背面，記得妥善保存</p>
    </div>

    <div class="postcard-grid">
      <figure class="postcard-card">
        <img src="images/postcard-front.jpg" alt="集章明信片正面">
        <figcaption>正面</figcaption>
      </figure>
      <figure class="postcard-card">
        <img src="images/postcard-back.jpg" alt="集章明信片背面，含 A/B/C/D 四個蓋章格">
        <figcaption>背面・蓋章區</figcaption>
      </figure>
    </div>
  </div>
</section>


<section style="padding-top:20px;">
  <div class="container">
    <div class="stamp-wrap">
      <div class="stamp-copy">
        <p>
          完成集章卡上的任務，並請工作人員蓋上印章。<br>
          集滿四枚印章後，即可向工作人員兌換限定小禮物。
        </p>
        <div class="prize">🎁 集滿 4 枚兌換「PP夾」（兩款隨機發放，數量有限送完為止）</div>
      </div>
      <div class="stamp-circles" id="stampCircles">
        <div class="stamp" data-letter="A"><span class="letter">A</span><span class="task">關卡一</span></div>
        <div class="stamp" data-letter="B"><span class="letter">B</span><span class="task">關卡二</span></div>
        <div class="stamp" data-letter="C"><span class="letter">C</span><span class="task">關卡三</span></div>
        <div class="stamp" data-letter="D"><span class="letter">D</span><span class="task">關卡四</span></div>
      </div>
    </div>
  </div>
</section>
